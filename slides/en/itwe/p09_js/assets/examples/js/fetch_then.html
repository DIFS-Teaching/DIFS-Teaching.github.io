<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fetch using then()</title>
</head>

<body>
  <script>
    fetch("https://countriesnow.space/api/v0.1/countries/iso")
      .then(response => {
        if (!response.ok) {
          throw new Error("HTTP error");
        }
        return response.json();
      })
      .then(result => {
        const countries = result.data;
        for (const country of countries) {
          document.body.innerHTML += `<p>${country.name} (${country.Iso3})</p>`;
        }
      })
      .catch(error => {
        console.error(error);
      });
  </script>
</body>

</html>
