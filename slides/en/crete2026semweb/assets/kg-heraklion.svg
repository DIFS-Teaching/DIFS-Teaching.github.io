<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" width="1400" height="620" font-family="'Open Sans', sans-serif" fill="#1f2937">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6f7a86"/>
    </marker>
    <style>
      .res { fill: #e8f2fb; stroke: #1676d0; stroke-width: 2.5; }
