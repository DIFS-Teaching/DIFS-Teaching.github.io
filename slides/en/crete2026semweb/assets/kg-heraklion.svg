      .e   { stroke: #6f7a86; stroke-width: 2.5; fill: none; marker-end: url(#a); }
      .lbl { font-size: 19px; font-family: monospace; fill: #1676d0; }
      .n   { font-size: 21px; text-anchor: middle; }
      .s   { font-size: 16px; text-anchor: middle; fill: #6f7a86; font-family: monospace; }
