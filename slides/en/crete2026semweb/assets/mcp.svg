<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 520" width="1500" height="520" font-family="'Open Sans', sans-serif" fill="#1f2937">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1676d0"/>
    </marker>
    <style>
      .box  { fill: #f3f7f6; stroke: #6f7a86; stroke-width: 2; }
      .main { fill: #e8f2fb; stroke: #1676d0; stroke-width: 3; }
      .h    { font-size: 28px; font-weight: bold; text-anchor: middle; }
      .t    { font-size: 20px; text-anchor: middle; fill: #4b5563; }
      .m    { font-size: 19px; font-family: monospace; fill: #1676d0; }
      .e    { stroke: #1676d0; stroke-width: 3; fill: none; marker-start: url(#a); marker-end: url(#a); }
      .el   { font-size: 18px; text-anchor: middle; fill: #6f7a86; font-style: italic; }
    </style>
  </defs>

  <!-- user -->
  <rect class="box" x="20" y="40" width="250" height="140" rx="10"/>
  <text class="h" x="145" y="100">You</text>
  <text class="t" x="145" y="135">a question in English</text>

  <!-- Claude -->
  <rect class="main" x="380" y="20" width="320" height="320" rx="10"/>
  <text class="h" x="540" y="70">Claude</text>
  <text class="t" x="540" y="110">knows SPARQL</text>
  <text class="t" x="540" y="140">reads the ontology docs</text>
  <text class="t" x="540" y="170">writes a query, runs it,</text>
  <text class="t" x="540" y="200">fixes it, runs it again…</text>
  <text class="t" x="540" y="250">explains the result</text>

  <!-- MCP server -->
  <rect class="main" x="810" y="20" width="330" height="320" rx="10"/>
  <text class="h" x="975" y="70">MCP server</text>
  <text class="t" x="975" y="100">tools Claude can call:</text>
  <text class="m" x="850" y="150">select_query()</text>
  <text class="m" x="850" y="190">invoke_service()</text>
  <text class="m" x="850" y="230">browse_iri()</text>
  <text class="m" x="850" y="270">get_services()</text>

  <!-- FitLayout -->
  <rect class="box" x="1250" y="20" width="230" height="200" rx="10"/>
  <text class="h" x="1365" y="75">FitLayout</text>
  <text class="t" x="1365" y="115">renderer +</text>
  <text class="t" x="1365" y="145">RDF repository</text>
  <text class="t" x="1365" y="175">(SPARQL)</text>

  <!-- PageView -->
  <rect class="box" x="1250" y="320" width="230" height="170" rx="10"/>
  <text class="h" x="1365" y="380">PageView</text>
  <text class="t" x="1365" y="420">browser GUI,</text>
  <text class="t" x="1365" y="450">highlights areas</text>

  <!-- edges -->
  <line class="e" x1="275" y1="110" x2="375" y2="110"/>
  <line class="e" x1="705" y1="180" x2="805" y2="180"/>
  <text class="el" x="755" y="165">MCP</text>
  <line class="e" x1="1145" y1="120" x2="1245" y2="120"/>
  <text class="el" x="1195" y="105">REST</text>
  <path class="e" d="M1145,300 L1200,300 L1200,405 L1245,405"/>
  <line class="e" x1="1365" y1="225" x2="1365" y2="315"/>

  <!-- footnote -->
  <text x="540" y="400" font-size="20" text-anchor="middle" fill="#6f7a86">MCP = Model Context Protocol:</text>
  <text x="540" y="430" font-size="20" text-anchor="middle" fill="#6f7a86">a standard “USB port” for giving an LLM tools</text>
</svg>
