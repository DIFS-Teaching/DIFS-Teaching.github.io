<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="'Open Sans', sans-serif" fill="#1f2937">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1676d0"/>
    </marker>
  </defs>
  <!-- subject -->
  <ellipse cx="190" cy="120" rx="170" ry="62" fill="#e8f2fb" stroke="#1676d0" stroke-width="3"/>
  <text x="190" y="112" text-anchor="middle" font-size="26" font-family="monospace">wd:Q160544</text>
  <text x="190" y="146" text-anchor="middle" font-size="22" fill="#6f7a86">(Heraklion)</text>
  <!-- predicate -->
  <line x1="362" y1="120" x2="836" y2="120" stroke="#1676d0" stroke-width="4" marker-end="url(#arr)"/>
  <text x="600" y="102" text-anchor="middle" font-size="26" font-family="monospace">wdt:P17</text>
  <text x="600" y="152" text-anchor="middle" font-size="22" fill="#6f7a86">(country)</text>
  <!-- object -->
  <ellipse cx="1010" cy="120" rx="170" ry="62" fill="#e8f2fb" stroke="#1676d0" stroke-width="3"/>
  <text x="1010" y="112" text-anchor="middle" font-size="26" font-family="monospace">wd:Q41</text>
  <text x="1010" y="146" text-anchor="middle" font-size="22" fill="#6f7a86">(Greece)</text>
  <!-- roles -->
  <text x="190" y="225" text-anchor="middle" font-size="24" font-weight="bold" fill="#00a9e0">SUBJECT</text>
  <text x="190" y="255" text-anchor="middle" font-size="20" fill="#6f7a86">what I talk about</text>
  <text x="600" y="225" text-anchor="middle" font-size="24" font-weight="bold" fill="#00a9e0">PREDICATE</text>
  <text x="600" y="255" text-anchor="middle" font-size="20" fill="#6f7a86">what I claim about it</text>
  <text x="1010" y="225" text-anchor="middle" font-size="24" font-weight="bold" fill="#00a9e0">OBJECT</text>
  <text x="1010" y="255" text-anchor="middle" font-size="20" fill="#6f7a86">another thing, or a value</text>
  <text x="600" y="292" text-anchor="middle" font-size="22" font-style="italic">“Heraklion is in Greece.”</text>
</svg>
